
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Branches - CasaHub Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <h2 class="section-title">Explore Our Branches</h2>

    <div class="product-grid">

        <div class="product-card">
            <a class="branch-link" href="casacraft.html" target="main">
                <img src="pics/craft.jpg" alt="CasaCraft">
                <h3>CasaCraft</h3>
                <p>Handmade crafts and accessories</p>
                <span class="shop-button">Explore Shop</span>
            </a>
        </div>

        <div class="product-card">
            <img src="pics/casaart.jpg" alt="CasaArts">
            <h3>CasaArts</h3>
            <p>Art and creative designs</p>
            <button class="action-button"
                    onclick="comingSoon('CasaArts')">
                Explore Shop
            </button>
        </div>

        <div class="product-card">
            <img src="pics/bites.jpg" alt="CasaBites">
            <h3>CasaBites</h3>
            <p>Meals and delicious food</p>
            <button class="action-button"
                    onclick="comingSoon('CasaBites')">
                Explore Shop
            </button>
        </div>

        <div class="product-card">
            <img src="pics/delights.jpg" alt="CasaDelights">
            <h3>CasaDelights</h3>
            <p>Pastries and sweet treats</p>
            <button class="action-button"
                    onclick="comingSoon('CasaDelights')">
                Explore Shop
            </button>
        </div>

        <div class="product-card">
            <img src="pics/fits.jpg" alt="CasaFits">
            <h3>CasaFits</h3>
            <p>Fashion and outfits</p>
            <button class="action-button"
                    onclick="comingSoon('CasaFits')">
                Explore Shop
            </button>
        </div>

        <div class="product-card">
            <img src="pics/notes.jpg" alt="CasaNotes">
            <h3>CasaNotes</h3>
            <p>Stationery and school supplies</p>
            <button class="action-button"
                    onclick="comingSoon('CasaNotes')">
                Explore Shop
            </button>
        </div>

    </div>

</div>

</body>
</html>
